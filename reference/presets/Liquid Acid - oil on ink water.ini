; Liquid Acid + INK IN WATER: the oil layer floating on real ink-in-water
; instead of the posterised duotone bands. This is what the acid references
; literally are. Base = reference/configs/liquid-acid-a.ini, unchanged except
; for the ink path and the sim settings the ink needs.
;
; OIL POPULATION (retuned 2026-09-17 for THIS flow): liquid-acid-a.ini's
; population was tuned against the busy WE-parity sim (vorticity 48, wanderers
; + idle splats), which constantly shoves the blobs apart. The ink sim here is
; deliberately calm (vorticity 12, no wanderers, no idle splats, one drop every
; ~11 s), so the same blobs settle, spread on `repulsion` alone and merge into a
; ~90% oil sheet with confetti holes. The [liquid_acid] population keys below
; are therefore this ini's OWN: fewer, fatter blobs (64 instead of 96), a higher
; isoline (threshold 0.65) and a tighter support (1.60), for ~50% coverage --
; big discs with ink channels between them, like a12. Everything else in
; [liquid_acid] is still liquid-acid-a.ini's palette A.
;
; [liquid_acid] ink_mode=water routes the ink through the SAME shared HLSL
; block as [look] style=ink (InkWater in src/shaders.h): Beer-Lambert
; translucency, edge darkening, inverted tinting. The oil rims, meniscus,
; swarms, speckle and grain are untouched and composite over it.
; The water ink reads the RAW dye, so like bands mode at ink_mix~=1 it bypasses
; the parity CSS chain, and the ink complement lock does not apply (water ink
; has no ramp) - hence ink_complement_lock=0 here.
; Base = reference/configs/we-look-live.ini (landed WE-parity look, 256 grid).

; --- MULTICOLOUR OIL (brief AE, ref oil-colour-combo-ref-1.jpg) -----------
; A second dye hue living IN the thin film: soft patches that the sim's own
; velocity advects, so they stretch and fold with the flow instead of sliding
; over it. The reference the user kept is a magenta film carrying cyan patches
; that read like a light leak -- but a leak is additive and would lift the
; black corners, and there the cyan sits UNDER the masses, which only a dye
; can do. The masses stay black over it; the droplets inside them take the
; same hue (crust_hue_mix), which is the ref's cyan-lit specks in the black.
; This palette sweeps through eight hues, so film_hue2 is a ROTATION off
; whatever the film currently is: -140 deg turns the hot pink toward cyan and
; keeps the same relationship at every step of the sweep. The amount is how
; far AROUND the wheel a patch goes, not a cross-fade to the far colour --
; blending magenta with cyan in RGB is grey -- so 1.0 is what lands the
; patch cores on the reference's cyan. Half of it would be blue.
film_hue2 = 0
film_hue2_amt = 0
film_hue2_scale = 0.35
film_hue2_drift = 1.0
film_hue2_decay = 0.35
film_hue2_wobble = 0
film_hue2_wobble_period = 300
film_hue2_seed_rows = 2
film_hue2_rise = 0.25
film_hue3 = 0
film_hue3_amt = 0
crust_hue_mix = 1.0

