; Liquid Acid — LAVA LAMP: the tile9 family rising from below.
; Base: build2/shots/explore/tile9-08.ini (near-full-frame coloured oil with
; black holes over MONO ink — the family the user "really likes"), plus the
; real-oil edge set, the transparent film at the user's 0.5 + held chroma, and
; the rise block. The oil climbs at 0.015 uv/s with a lazy wobble and re-enters
; under the bottom edge; the metaball field merges and necks the lobes apart as they pass. Colour changes by rotating the whole oil palette's hue continuously (600 s per turn).
; Bubbles stay black: the ink is mono and only the oil takes the hue.
[moods]
enabled = 0
migrated = 1

[cycle]
enabled = 0

[hdr]
peak_nits = 700
compensation = 1
saturation = 1.20
brightness = 1.08
contrast = 1.00
knee = 0.70
gamut = 1

[sim]
sim_res = 256
dye_res = 4096
density_diffusion = 0.999
velocity_diffusion = 0.999
pressure_diffusion = 0.85
pressure_iterations = 20
vorticity = 12
splat_radius = 0.64
decay_fast = 1.000
decay_threshold = 0.290
saturation_restore = 0
max_brightness = 1.35
shading = 1
dye_diffusion = 0.000
baroclinic = 0.000
flow_speed = 1.00
gravity = 0
gravity_pow = 1.5
gravity_blur = 3

[behavior]
color_cycle_period = 19
wanderers = 0
wanderer_count = 2
wanderer_mode = 0
wanderer_speed = 246
wanderer_brightness = 0.10
wanderer_scale = 0.10
wanderer_resume_delay = 4.5
auto_pause = 1
dark_floor = 9
dark_level = 0.070
surv_dark_floor = 8
contrast_req = 30
dart_enabled = 0
dart_interval = 7
dart_speed = 967
hueshift_enabled = 0
hueshift_step = 83
hueshift_linger = 6.5
hueshift_glide = 7.2
hueshift_burst_steps = 2
hueshift_off_time = 10
idle_splats = 0
idle_interval = 9.6
idle_amount = 8
idle_brightness = 1.50
hold_to_splat = 0
splat_on_click = 0
show_mouse = 0

[color]
colorful = 1
more_colors = 1
post_saturation = 1.14
post_brightness = 1.06
post_contrast = 1.34
post_hue = 14.4
hue_center = 0
hue_range = 180
hue_linger = 0
curve_enabled = 0
shadow_floor = 0.100
shadow_knee = 0.15

[general]
fps_limit = 144
mirror_second = 0
pause_on_fullscreen = 1

[look]
style = liquid_acid

[liquid_acid]
rim_vary = 0.4
rim_ink_follow = 0.5
blob_count = 96
disc_frac = 0.16
web_frac = 0.32
bubble_frac = 0.28
disc_min = 0.160
disc_max = 0.380
web_min = 0.070
web_max = 0.200
bubble_min = 0.015
bubble_max = 0.075
hole_min = 0.030
hole_max = 0.130
size_bias = 2.0
big_bias = 0.75
hole_weight = 0.608
; Coverage: the tile9 bases sit at threshold ~0.47-0.56 with repulsion
; 0.90 and NO rise. Under a constant rise the blobs bunch as they climb
; and that pair floods the frame into one continent (rendered: the oil
; filled ~90%). 0.85 + the tile9 repulsion puts the coverage back where
; the tile9 tiles sit while leaving the lobes separate enough to neck
; apart and merge on the way up, which is the lava-lamp read.
threshold = 0.85
support_scale = 2.00
flow_gain = 1.15
curl_drift = 0.0016
repulsion = 0.90
rim_width = 0.0016
rim_inset = 0.0022
rim_dark = 0.80
meniscus = 0.85
meniscus_width = 0.0020
meniscus_offset = 0.0030
meniscus_color = 0.02 0.02 0.02
swarm_clump = 0.85
swarm_dark = 0.35
refraction = 0.050
translucency = 0.10
ink_shading = 0.00
oil_texture = 0.0759
swarm_holes = 0
; --- DROPLET PARTICLE SIM -------------------------------------------------
; Real particles, not the screen-space cellular swarms: they are added into
; the SAME metaball field as the big blobs, so a trapped water droplet is a
; literal hole in the oil and an oil droplet on the ink a literal bump of it.
; They ride the oil they sit in, nucleate where the film is thin, attract,
; coalesce (area-conserving) and dissolve. swarm_holes/swarm_drops are set to
; 0 here explicitly -- the code forces them off anyway, but ONE system is the
; point and the ini should say so.
droplets = 1500
droplet_spawn_rate = 40
swarm_drops = 0
swarm_density = 0.2674
swarm_scale_holes = 22
swarm_scale_drops = 30
swarm_r_min = 0.120
swarm_r_max = 0.420
swarm_rim_dark = 0.55
ink_levels = 4
ink_soft = 0.60
ink_mix = 0.95
ink_hue_vary = 3
ink_gain = 1.30
ink_bias = 0.03
seam_strength = 0.30
seam_lo = 0.06
seam_hi = 0.70
grain = 0.057
grain_scale = 3.0
speckle = 0.2227
oil_color_1 = 0.95 0.40 0.10
oil_color_2 = 0.98 0.45 0.08
oil_color_3 = 0.92 0.35 0.12
oil_color_4 = 1.00 0.50 0.05
ink_stop_1 = 0.086 0.478 0.494
ink_stop_2 = 0.016 0.040 0.046
ink_stop_3 = 0.478 0.165 0.020
ink_stop_4 = 0.980 0.545 0.078
ink_mode = water
ink_complement_lock = 0
; --- "real oil" edge set (54780a0): no stroked boundary, the film thins
; --- to nothing at its edge and the halo is emergent from the ink. ---
oil_thin_edge = 0.70
oil_edge_frac = 0.14
oil_specular = 0.35
oil_iridescence = 0.20
swarm_lens = 0.80
meniscus_from_ink = 1.0
oil_glow = 0.45
refraction_width = 22

; --- transparent coloured film (08a89aa) at the user's pick: 0.5 with the
; --- chroma held back to the opaque level (measured x1.19 on tile9-08). ---
oil_transparency = 0.5
oil_absorb = 2.6
oil_film_bump = 0.35
oil_refract_body = 0.006
oil_ink_blur = 0.5
; USER PICK (2026-09-17): oil_transparency 0.5 with the chroma HELD to the
; opaque level -- "the 50% chroma held is the best". post_chroma scales the
; finished frame's colourfulness about its own luma; measured on tile9-08 at
; t=75, OKLab means over the non-dark pixels: opaque L .663 C .194, film 0.5
; alone L .575 C .169, film 0.5 + post_chroma 1.2 / post_lift 1.08 L .63 C .20.
post_chroma = 1.2
post_lift = 1.08

; --- LAVA LAMP rise ---
; one screen height in ~65 s
rise_speed = 0.015
rise_wobble = 0.5
rise_respawn = 1
rise_stretch = 0.45
rise_bottom_light = 0.5
oil_saturation = 1.0
hue_sweep_period = 0
hue_rotate_period = 420
; Continuous rotation of the WHOLE oil palette instead of the curated
; list: one hue for the entire screen, 600 s per turn. Not every hue is
; equally vivid at one S/V (yellow goes olive) — that is the trade.

oil_drag = 0.9
oil_dye_block = 0.7
rise_parallax = 0.7
rise_parallax_dim = 0
oil_viscosity = 0.6
mouse_oil_mode = 0

[ink]
inverted = 1
chroma = 0
paper_color = 0.00 0.00 0.00
tint_thin = 0.85 0.85 0.85
tint_thick = 1.00 1.00 1.00
