; Grey heart (overlay).ini -- brief BX: a PARTIAL overlay for any oil (liquid_acid)
; look. It carries only the three heart keys, so applying it from the tray turns the
; MIDDLE of whatever oil stage is running toward grey and leaves every other key alone.
; The user: "don't apply colored after filters, have a true color and make it
; look grayscale in the middle". The frame keeps its true stage colours; a
; luminance-kept (Y-flat) desaturation is strongest in the centre and fades to none
; toward the edges, so the middle reads like a pale black-and-white print framed by
; the stage's own colour. The oil stays black. Nothing on the fluid (WE) look.
; Target: the user's own Lightroom radial edit of monotone-post-0924
; (handoff\review\colour-mocks\user-lr-radial-heart.webp), scaled 1.3x (their pick).
;
; lamp_grey_heart       0..1 amount (1 = fully grey). 0.85 = the edit's ~22% chroma
;                       kept in the middle (OKLab, measured with the lift on; 0.75
;                       keeps ~33% because the lift raises chroma too)
; lamp_grey_heart_size  outer radius, half-frames (ellipse; edge midpoints 1,
;                       corners 1.41); full inside 0.3 x this. 1.3 = the edit, 1.7 = x1.3
; lamp_grey_heart_lift  0..0.8 lifts the greyed FILM (masses never): 0.45 = the
;                       edit's x1.45 in the middle. Trim first if the panel pumps (ABL).
; Cycle: reference\configs\cycle-final.ini stage 21 (wild), composed on
; monotone-post-0924. Turn it off again with lamp_grey_heart = 0.
[meta]
look = liquid_acid
[liquid_acid]
lamp_grey_heart = 0.85
lamp_grey_heart_size = 1.7
lamp_grey_heart_lift = 0.45
