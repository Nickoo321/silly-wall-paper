stage_1_dwell=20
stage_1_jitter=0
stage_2_file=../presets/WE journey - Aurora.ini
stage_2_base=we-look-live.ini
stage_2_dwell=20
stage_2_jitter=0
stage_3_file=acid-rise-12.ini
stage_3_dwell=20
stage_3_jitter=0
