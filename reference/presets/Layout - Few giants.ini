; Layout - Few giants.ini -- brief BZ BLACK-MASS phase 1
; Few giants (target ~28 %, 2-3 huge lobed black masses, some cut by the frame edge, sparse droplets):
; 50 blobs (vs 126) open big black gaps round one lit film; bubble_frac .37 leaves ~3 holes (grow-in: 7 %
; of new blobs), holes .15-.30 at weight 2.5 = large black masses inside the film once the turnover has
; grown them in unscaled (the seed sub-scales holes into their parent); droplets 500. blob_turnover_s 90
; (50 blobs -> one swap per 1.8 s, never blocked: 50 live + ~22 retirees < 127) so the layout arrives
; as a glide when applied over a running look.
; Layout presets (brief BZ BLACK-MASS phase 1): PARTIAL overlays on reference\configs\monotone-post-0924.ini
; ("Today" = that base itself, no file). ROLE A: on the monotone base the FILM is lit and the black masses
; are the GAPS between the oil blobs (+ kind-3 holes); fewer/smaller positive blobs = more black.
; Every layout sets the same key set (base values where it does not move a key) so the three can be
; applied in any order; blob_turnover_s is set only where the layout needs its kind keys to reach a
; standing population (Lava rise inherits it). Oil and droplets stay black (dye_lum 0 / dye_droplet_lum -1
; are the base's), film_level untouched, bloom = the base's.
; black % = share of max(R,G,B) < 40 on the 8-bit SDR png (tools\black-share.ps1), 1280x720,
; 300 s window (31 frames, 10 s apart), seeds 1234/5678/9012, HDR on; HDR off seed 1234.
; MEASURED (tools\black-share.ps1, T0 90 s = one turnover period): seeds 1234/5678/9012 = 25.6 / 27.1 / 27.6, mean 26.8 (target ~28); HDR off 1234 = 25.6 (= on). Frames swing 4..54 (a giant gap passes).
[meta]
look = liquid_acid
[liquid_acid]
blob_count = 50
bubble_frac = 0.37
hole_min = 0.15
hole_max = 0.3
hole_weight = 2.5
threshold = 0.79
rise_stretch = 0.45
droplets = 500
blob_turnover_s = 90
