; Scheme - Blue Coral.ini -- brief BV colour scheme: an OFFSET PATTERN, a partial overlay
; on reference\configs\monotone-post-0924.ini. It never sets a film hue: the pattern
; rides the hue rotation (hue_rotate_period) and hue_anchor_weight 1 makes the
; rotation linger at the proven anchors (magenta 325 most, blue 215, red 355,
; violet 275). The named look is what the pattern shows at its ANCHOR hint.
; Pattern: hue2 +160.
; Named schemes on this pattern (tier, anchor = film hue of the named look):
;   Blue / Coral     HOME 5       anchor 215 -- seam violet-magenta (proven-4)
; Rules (brief BV): oil + droplets black (dye_lum 0, dye_droplet_lum -1); FILMS
; equal-loaded (film_equal_load, dims only); PATCH cores follow film_equal_load_patches (low
; where a yellow/gold/lime member must stay bright); third colour <= ~15% of the frame
; (film_hue3_share: 0.75 ~ 13% at cover 0; with cover 0.04 it is 1, see below).
; FINAL-CYCLE C + brief BW: film_hue2_cover 0.04 with film_hue2_scale 0.25 (BW shipped 0.08 at 0.25:
; mean ~36%, P95 58%, max 82%, 3 patches; the user saw a 50/50 split live on 2026-09-26 and asked for
; less second colour -> 0.04 (CPU logger at scale 0.40: 0.04 -> ~18%, 0.08 -> ~30%); re-measure pending.
; brief BW: film_hue2_seam 0.33 (one thin seam line); film_equal_load_patches 0.5 (the patch cores load the panel like the magenta film).
; palette_start_hue 215 (brief BW): the palette clock starts where the film is 215 (the
; anchor of the named look) at app start and at each cycle entry, not on oil_color_1 orange.
[meta]
look = liquid_acid
[liquid_acid]
hue_sweep_period = 0
hue_anchor_weight = 1
palette_start_hue = 215
dye_lum = 0
dye_droplet_lum = -1
film_equal_load = 0.75
film_hue2 = 160
film_hue2_amt = 1
film_hue2_scale = 0.25
film_hue2_cover = 0.04
film_hue2_seam = 0.33
film_equal_load_patches = 0.5
film_hue3_amt = 0
shadow_tone = 0
