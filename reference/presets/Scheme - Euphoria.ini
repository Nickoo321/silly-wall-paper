; Scheme - Euphoria.ini -- brief BV colour scheme: an OFFSET PATTERN, a partial overlay
; on reference\configs\monotone-post-0924.ini. It never sets a film hue: the pattern
; rides the hue rotation (hue_rotate_period) and hue_anchor_weight 1 makes the
; rotation linger at the proven anchors (magenta 325 most, blue 215, red 355,
; violet 275). The named look is what the pattern shows at its ANCHOR hint.
; Pattern: hue2 -45, hue3 +125.
; Named schemes on this pattern (tier, anchor = film hue of the named look):
;   Euphoria         T5 3-COLOUR  anchor 275 -- listed +125/-45; SWAPPED so the amber (yellow-band) member is the smaller third (user rule)
; Rules (brief BV): oil + droplets black (dye_lum 0, dye_droplet_lum -1); FILMS
; equal-loaded (film_equal_load); yellow/gold/lime PATCHES kept bright (lifts, which
; act only on patch pixels in the 35..95 deg band, whichever member is there as the
; pattern rotates); third colour <= ~15% of the frame (film_hue3_share 0.75 ~ 13%).
[liquid_acid]
hue_sweep_period = 0
hue_anchor_weight = 1
dye_lum = 0
dye_droplet_lum = -1
film_equal_load = 1
film_hue2 = -45
film_hue2_amt = 1
film_hue2_scale = 0.40
film_hue2_lift = 1
film_hue3 = 125
film_hue3_amt = 1
film_hue3_share = 0.75
film_hue3_lift = 1
shadow_tone = 0
