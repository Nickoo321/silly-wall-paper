; cycle-final.ini -- THE SHIPPED CYCLE (brief reference/briefs/FINAL-CYCLE.md A + B,
; creative decisions 2 + 3, 2026-09-25). Supersedes cycle-first.ini.
;
; TIER MODE (stage_N_tier): each non-WE draw picks a tier by 7 : 2 : 1
; (proven : moderate : wild), then a stage inside the tier by its stage_N_weight,
; which is now a WITHIN-TIER MULTIPLIER (default 1). WE (we-look-live) is not drawn by
; tier: it ALTERNATES with every oil / ink / overlay stage -- WE, X, WE, X ...
; Each oil / ink visit makes its one draw at its dwell midpoint (the X after the next
; WE); that draw can also land on the "burst moment" (wild, burst_weight 1): one tamed
; burst on the running oil stage -- the palette clock runs forward and lands on the
; nearest proven anchor. Oil stages run with the fluid hue-shift bursts OFF.
;
; HOME / proven (70%): monotone-post-0924 x2 (the live look; full split tone 1),
;   Return to Form x3, Lightroom x2, Magenta/Mint x1.5, Magenta/Cyan x2.5 (= its own x1.5
;   + Red/Sky x1: Red/Sky is the SAME offset pattern (hue2 -140) seen at the red anchor
;   355; the anchor drift shows both, so one stage carries both weights),
;   Blue/Coral x1.5, Violet/Amber x1.
; MODERATE (20%): acid-rise-12 (the crisper pre-filmic lens, blue film; here with the
;   split tone at HALF strength -- the user's "sometimes one, sometimes the other":
;   monotone carries 1, this stage 0.5; every Scheme keeps the tone it was designed
;   with), and the 3-colour tier: Teal/Orange (moved from home), Neon Demon, Euphoria,
;   Warm Arc, Bright Triad, Bright Split -- all x1.
; WILD (10%): the 4-colour tier Synthwave, Microscope, Square+; ink-inverted; the
;   Mirror quad overlay; the burst moment (burst_weight) -- all x1.
; BURSTS OFF for now: burst_weight=0 (decided 2026-09-25 after the proof: the patches are not
;   equal-loaded, so a burst swung mean_lum -28% / +41%, over the 15% limit). The burst stays coded;
;   set burst_weight=1 again once a follow-up equal-loads the patches.
; BW re-measure (2026-09-25, Magenta/Mint, palette_start_hue 325, burst forced at 40 s vs a control run):
;   patches equal-loaded (film_equal_load_patches 0.75) the TRANSIT dip is -23% (was -53% at 0.75 and -68% at
;   0 on the old preset), but the burst LANDS on blue 215 and blue loads the panel -34% below magenta for as
;   long as it stays there (equal load only ever dims, never brightens). Still over 15%: burst_weight stays 0.
; OUT (creative decision 2): acid-rise-2hue, acid-rise-rotate, lapd-look-candidate.
; Not listed in A: Scheme - Lightroom Triad (not a stage).
;
; Scheme stages are PARTIAL overlays on monotone-post-0924 (stage_N_base). Two of them
; back to back (a manual jump, or order=fixed) change with NO black: the extra colours
; and tones ramp to 0 over scheme_ramp s, the offsets swap, they ramp back.
; Dwell (user: "keep moving, up to 4 mins per definite stage"): WE 240 s, oil 180 s,
; ink 150 s, overlay 120 s, +-30% jitter, 240 s hard maximum.
;
; Headless (the proof run): stage files resolve relative to THIS file's folder.
;   FluidWallpaper.exe --shot out.png --ini reference\configs\cycle-final.ini --hdr on
;     --shot-delay 0 --shot-series N:S --cycle-dwell 20 --cycle-seed 1234 --shot-png-only
; Live: tools\cycle-install.ps1 copies this [cycle] block into
; %APPDATA%\FluidWallpaper\settings.ini with absolute paths (the maintainer runs it
; outside the Claude desktop app). [cycle] enabled=0 there is today's app, bit for bit.
