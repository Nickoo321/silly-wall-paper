; Coverage: the tile9 bases sit at threshold ~0.47-0.56 with repulsion
; 0.90 and NO rise. Under a constant rise the blobs bunch as they climb
; and that pair floods the frame into one continent (rendered: the oil
; filled ~90%). 0.85 + the tile9 repulsion puts the coverage back where
; the tile9 tiles sit while leaving the lobes separate enough to neck
; apart and merge on the way up, which is the lava-lamp read.
threshold = 0.85
support_scale = 2.00
flow_gain = 1.15
curl_drift = 0.0016
repulsion = 0.90
rim_width = 0.0016
rim_inset = 0.0022
rim_dark = 0.80
meniscus = 0.85
