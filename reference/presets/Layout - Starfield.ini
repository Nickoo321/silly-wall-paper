; Layout - Starfield.ini -- brief BZ BLACK-MASS phase 1
; Starfield (target ~12 %, dense small droplets, no big mass): threshold .62 keeps the film continuous at
; 88 blobs (no big gap mass: the flattest black curve of the sheet); bubble_frac .15 leaves ~22 holes
; (grow-in 29 %) of .03-.08 at weight 3 = small black dots in the film, unscaled once turned over
; (blob_turnover_s 90, 88 blobs -> never blocked). The droplets themselves are dark but NOT black in the
; SDR png (cores 60-130: per-droplet optics + halo/fog), so the metric sees mostly the holes: see RESUME.
; Layout presets (brief BZ BLACK-MASS phase 1): PARTIAL overlays on reference\configs\monotone-post-0924.ini
; ("Today" = that base itself, no file). ROLE A: on the monotone base the FILM is lit and the black masses
; are the GAPS between the oil blobs (+ kind-3 holes); fewer/smaller positive blobs = more black.
; Every layout sets the same key set (base values where it does not move a key) so the three can be
; applied in any order; blob_turnover_s is set only where the layout needs its kind keys to reach a
; standing population (Lava rise inherits it). Oil and droplets stay black (dye_lum 0 / dye_droplet_lum -1
; are the base's), film_level untouched, bloom = the base's.
; black % = share of max(R,G,B) < 40 on the 8-bit SDR png (tools\black-share.ps1), 1280x720,
; 300 s window (31 frames, 10 s apart), seeds 1234/5678/9012, HDR on; HDR off seed 1234.
; MEASURED (T0 90 s): seeds 1234/5678/9012 = 7.0 / 8.5 / 6.4, mean 7.3 (target ~12: -4.7, inside +-5 only just); HDR off 1234 = 7.0 (= on). The flattest curve of the sheet (0.8..16): no big mass.
[meta]
look = liquid_acid
[liquid_acid]
blob_count = 88
bubble_frac = 0.15
hole_min = 0.03
hole_max = 0.08
hole_weight = 3
threshold = 0.62
rise_stretch = 0.45
droplets = 950
blob_turnover_s = 90
