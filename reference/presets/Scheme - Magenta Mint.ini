; Scheme - Magenta Mint.ini -- brief BV colour scheme: an OFFSET PATTERN, a partial overlay
; on reference\configs\monotone-post-0924.ini. It never sets a film hue: the pattern
; rides the hue rotation (hue_rotate_period) and hue_anchor_weight 1 makes the
; rotation linger at the proven anchors (magenta 325 most, blue 215, red 355,
; violet 275). The named look is what the pattern shows at its ANCHOR hint.
; Pattern: hue2 +180.
; Named schemes on this pattern (tier, anchor = film hue of the named look):
;   Magenta / Mint   HOME 3       anchor 325 -- seam red-orange-yellow (proven-2)
; Rules (brief BV): oil + droplets black (dye_lum 0, dye_droplet_lum -1); FILMS
; equal-loaded (film_equal_load, dims only); PATCH cores follow film_equal_load_patches (low
; where a yellow/gold/lime member must stay bright); third colour <= ~15% of the frame
; (film_hue3_share: 0.75 ~ 13% at cover 0; with cover 0.04 it is 1, see below).
; FINAL-CYCLE C + brief BW: film_hue2_cover 0.08 with film_hue2_scale 0.25 (was 0.08 at 0.40:
; mean ~37% but a big random swing: 12-seed P95 65-68%, max 91%); now the same mean with P95
; ~59%, max 65%, 3 patches (the biggest ~3/4 of the colour): multi-seed CPU distribution, BW report.
; brief BW: film_hue2_seam 0.33 (one thin seam line); film_equal_load_patches 0.75 (the patch cores load the panel like the magenta film).
; palette_start_hue 325 (brief BW): the palette clock starts where the film is 325 (the
; anchor of the named look) at app start and at each cycle entry, not on oil_color_1 orange.
[meta]
look = liquid_acid
[liquid_acid]
hue_sweep_period = 0
hue_anchor_weight = 1
palette_start_hue = 325
dye_lum = 0
dye_droplet_lum = -1
film_equal_load = 0.75
film_hue2 = 180
film_hue2_amt = 1
film_hue2_scale = 0.25
film_hue2_cover = 0.08
film_hue2_seam = 0.33
film_equal_load_patches = 0.75
film_hue3_amt = 0
shadow_tone = 0
