; --- per-droplet DEPTH (2026-09-18, brief N) -------------------------------
; Every droplet and ring sits at its own distance from the lens, spread about
; the masses' own plane; the back layer climbs a little faster than the front
; (the user's idea), so the depth reads in the motion as well as in the blur.
; Does nothing without [post] dof_max_px.
droplet_depth = 0.35
depth_rise = 0.22

; --- CONSERVATION OF MASS (brief S, 2026-09-18) ---------------------------
; "matter cannot be created or destroyed": nothing appears or vanishes at a
; visible size in the open. Droplets that leave the frame re-enter from the
; opposite edge with their size, ring and seed intact (they used to be killed
; at the top and re-nucleated anywhere, which piled 8.5x as many of them into
; the top band of the frame as the bottom -- the user's "why is the motion
; randomly grouping in this spot"); a blob only wraps once its own field is
; clear of the frame; a new droplet swells from below the resolvable floor
; over spawn_grow_s instead of popping in over a third of a second; one dying
; of old age fades out over dissolve_s. Coalescence was already
; area-conserving and is unchanged.
conserve_mass = 1
spawn_grow_s = 4
dissolve_s = 5
; --- DIFFRACTION, the size side (2026-09-18, brief W) -----------------------
; The other half of the point spread: a feature narrower than it has light
; filled in from all round it and cannot reach full darkness. Tiny droplets
; come out as soft grey dots, medium ones dark with soft edges, only the big
; masses go truly black. It only ever takes darkness away from small things,
; so the black under a mass is untouched.
diffraction = 1
diffraction_px = 1.5
; --- DROPLET LENS SHADING (2026-09-18, brief X) ----------------------------
; The user, on the oil-and-water reference against our live frame: "I was
; thinking of the oil boundary layer -- some mechanics of how it should be
; gradual -- and it translated to it just being blurry. The ratio of blurry to
; focused is off." In the reference every droplet down to four pixels is CRISP
; at its edge and GRADUAL inside it: a thin bright refractive rim just outside,
; a darker band just inside, a lighter middle (the droplet is a lens focusing
; the backlight) and a small specular from the lamp. None of this adds blur --
; the crispness is the edge, the gradualness is the interior, and the specular
; reads the same rig the haze and the bloom do, so it swings with the lamp.
droplet_lens = 0.55
droplet_lens_centre = 0.30
droplet_lens_band = 3.0
droplet_spec = 0.35

; --- COALESCENCE (user 2026-09-18, panel photo lobed-groups-of-5) ---------
; "all of these things are groups of 5, like what". droplet_merge's overlap
; distance sits inside the contact repulsion's rest distance, so it was
; unreachable and touching droplets stayed necked together as a permanent
; lumpy 4-6 lobed cluster. Now a contact coalesces at 8/s, area-conserving,
; and the neck closes over a second into one round droplet. Rings keep their
; foam rafts with shared walls.
droplet_coalesce = 1
droplet_coalesce_s = 1.0

; --- BIG HOLLOW BUBBLES (user 2026-09-18, photo big-hollow-bubble-liked) --
; "the big faint transparent lens in the middle-left is exactly what I want
; more of". Rings used to share the solid droplets' radius range, which is
; itself clamped by the shader's 3x3 cell walk, so a hollow bubble could never
; be more than a small ring. A big ring is now registered in every grid cell
; its support covers, which restores the walk's invariant, so it may be up to
; droplet_ring_r_mul times droplet_r_max. It is born at nothing and swells
; (conserve_mass), keeps the same thin wall as a fraction of its radius, and
; only a small share of new rings are big -- a couple visible at a time.
droplet_ring_r_mul = 3.5
droplet_ring_big_frac = 0.10

; --- RACING MICRO-BUBBLES (brief Y, user 2026-09-18 19:50) ----------------
; "I just saw racing small bubbles -- add more of those, like in water the
; uber small bubbles that go up: still slowish but considerably faster than
; the others." A share of the SMALLEST trapped droplets climb a multiple of
; their neighbours' speed with a lazy lateral spiral, born off-frame below the
; bottom edge and wrapping (conserve_mass), so one is never seen to appear
; mid-climb. racer_r_max is the smallest size that still RESOLVES on the panel
; (1.6 * rim_width is the contribution gate's floor, ~0.0026), not 2 * r_min,
; which would be invisible.
droplet_racer_frac = 0.25
droplet_racer_speed = 2.0
droplet_racer_wobble = 0.5
droplet_racer_r_max = 0.0050

; --- BUBBLE WEATHER (U9, 2026-09-18) --------------------------------------
; The droplet population has one steady state and settles into it. Weather
; gives it seasons on a minutes-long clock -- a spell of rings and big hollow
; bubbles, then of solids, a sparse spell, a crowded one -- by walking the
; target count and the ring shares between hashed per-phase targets. Never a
; jump and never a mass kill: the target moves smoothly and conserve_mass does
; the rest (surplus dissolves, shortfall grows in).
weather = 0.5
weather_period_s = 300
; --- THE DYE'S OWN DEPTH (2026-09-18, brief AA) ----------------------------
; The user: "the bottom right blob isn't getting more out of focus even as it
; approaches the edge." True, and by construction -- the per-pixel depth
; accumulator was primed with a constant 0.5, which is exactly camera_focus,
; so every pixel with no droplet in it (i.e. every big dye mass) sat ON the
; plane of focus by definition and could only blur through the shape of the
; focus surface. The dye is a layer at its own height now, with a gentle slope
; along the direction of the rig's lamp, so the slab and the focus surface are
; not parallel: they cross on a LINE instead of agreeing over a region, and
; that line travels as the lamp drifts. dof_max_px goes 5 -> 9 with it: the
; corners were already reaching the old clamp, so the extra depth had nowhere
; to show.
dye_depth = 0.5
dye_depth_tilt = 0.28
dye_depth_w = 0.25

[ink]
inverted = 1
chroma = 0
paper_color = 0.00 0.00 0.00
tint_thin = 0.85 0.85 0.85
tint_thick = 1.00 1.00 1.00

[post]
post_glow_dark = 0.6
post_glow_px = 10
post_glow = 0.22
post_blur_px = 0
; The CAMERA, and it is a MICROSCOPE, not a film stock: oil under a macro lens.
; The user's own summary of the reference photos is "super super slightly
; doubling plus noise", so everything optical here errs subtle and every knob
; is left for them to push.
;   softness  nothing in a macro shot is razor-sharp -- "these edges are way
;             too accurate and focused". Defocuses the isolines themselves
;             (coverage band, film edge, rim, meniscus); the grain stays sharp.
;   halo      the bright-field double contour: a weak, WIDE glow hugging the
;             outside of every dark shape with a faint darker echo beyond it.
;   aberration a warm/cool fringe along each edge, under a pixel wide: present,
;             minor, and only visible if you look for it.
;   film_grain real film grain, luminance-weighted, clearly there.
;   vignette  a gentle field-stop fall-off, never a circle.
film_grain = 0.11
film_grain_size = 1.5
film_grain_speed = 1
film_grain_color = 0
softness = 0.5
halo = 0.12
halo_px = 12
aberration = 1
aberration_px = 1.8
aberration_field = 1.2
vignette = 0.12
band_min = 1

; --- FILM OVERLAY (2026-09-18, brief P) ------------------------------------
; The artefacts of a projected film, procedural and image-space: hairs caught
; in the gate, dust, fine scratches, the odd coloured light leak. Additive and
; weighted into the DARK pixels ("the black oil more than the oil"), authored
; at 1440p and scaled with the frame, and the population CHANGES -- the dust
; flickers every film frame, a hair sticks for a few seconds, a scratch
; persists for a stretch and drifts away. "A very very subtle thing" (the
; user), so these are starting points: every one of them is a Settings slider.
film_dust = 0.10
film_hairs = 0.12
film_scratches = 0
film_leak = 0.06
film_artefact_rate = 5
; a second, finer and faster noise layer under the coarse grain
film_noise = 0.04
film_noise_size = 1
; the stock's own grade, last of all: lifted teal shadows, warm highlights
film_stock = 0.15

; --- LIGHT IN THE WATER (2026-09-18, brief Q) ------------------------------
; The reference is a glass of cloudy water with a lamp under it: the water
; itself glows, brightest near the lamp and fading with distance, and the
; bright film bleeds a very wide, very weak wash into the black. One off-view
; light position drives both, and it never sits still -- a sum of slow sines
; over seconds to a minute, the frame's own idle animation. The haze falls to
; EXACTLY zero away from the lamp, so the OLED's black is still black.
fog = 0.35
fog_px = 700
bloom = 0.30
bloom_px = 140
light_x = 0.5
light_y = 1.2
light_drift = 1
; --- PERSPECTIVE CAMERA + DEPTH OF FIELD + TILT (2026-09-18, briefs N + R) --
; The camera stops being an orthographic scanner. It is a LENS at the tip of a
; view cone looking down at the dish, so:
;   camera_fov          off-axis rings are seen at an angle: foreshortened
;                       radially toward the axis, the far side of the wall
;                       thicker than the near side, the highlight swung toward
;                       the axis. 0 = the old symmetric stamped circles.
;   dof_max_px          each element is blurred by how far its OWN depth is
;                       from the plane of focus, up to this radius, instead of
;                       one blur for the whole frame. post_blur_px is the floor
;                       under it -- the lens's own softness.
;   camera_field_curve  the surface of focus bends away from the flat dish with
;                       distance from the axis, so the centre and the corners
;                       cannot both be sharp.
;   focus_tilt          ...and it is slanted, freelensing style: a band of
;                       sharpness focus_band_px wide across the frame.
;   focus_tilt_period   the tilt and the focus distance do NOT drift. They hold
;                       still for about this many seconds, then somebody
;                       re-tilts the lens over focus_tilt_move_s -- eased, with
;                       a slight overshoot and settle -- and hold again.
camera_fov = 28
camera_focus = 0.5
camera_field_curve = 0.12
camera_axis_x = 0.5
camera_axis_y = 0.5
focus_tilt = 0.26
focus_tilt_angle = 25
focus_band_px = 340
focus_tilt_period = 75
focus_tilt_move_s = 1.4
dof_max_px = 9
; --- DIFFRACTION (2026-09-18, brief W) -------------------------------------
; The user, on a photo of an in-focus ring: "a thin hair on a film will never
; cause pure darkness because the light bends around it; it's not out of focus
; per se." psf_px is the lens's POINT SPREAD and it is the floor under the
; defocus radius whatever the focus -- "razor sharp" means diffraction-limited,
; not pixel-limited, and at 1 px an in-focus isoline can never come out as the
; stair-stepped coverage AA the photo caught.
psf_px = 1.0
; --- OUTPUT DITHER (2026-09-18, brief V0) ----------------------------------
; The panel quantises to 10 bits, and on a big saturated flat -- which is most
; of this look -- the user can see the steps on the OLED. Half an LSB of
; ordered noise on the finished frame breaks them into a pattern the eye
; integrates away. It fades out into true black, so an off pixel stays off.
dither = 1
; --- HALATION (2026-09-18, brief V1) ---------------------------------------
; CineStill 800T is ordinary cinema stock with the anti-halation backing
; removed: light from a highlight crosses the emulsion, reflects off the base
; and comes back a few pixels out, reddened by the layers it has now crossed
; twice. Tight (not the wide weak `bloom`), taken only from what is genuinely
; bright, landing in the DARK around a highlight rather than on it -- the
; difference between the film glowing and the picture being over-exposed. It
; pools toward the rig's lamp, so its asymmetry turns as the lamp wanders.
halation = 0.25
halation_px = 14
halation_warmth = 0.75
; --- MOTION (2026-09-18, brief V3 / U 4,7,11,12) ---------------------------
; Nothing may sit at a fixed screen position on an OLED, ever, and the motion
; model is specific: a SLIGHT, SLOW drift all the time, plus occasional
; readjustments where EVERYTHING moves at once, eased, with a settle. Never
; constant visible motion, never one effect moving alone.
;   shimmer         the air above the lamp: a fine refractive wobble, strongest
;                   near the light, advected by the sim's own velocity field.
;   vignette_wander the vignette's centre follows the rig's lens, so the
;                   darkest corner turns over minutes.
;   pixel_shift_px  the safety net: the whole frame walks a many-minute orbit
;                   a few thousandths of a pixel per frame.
;   rig_readjust    how far the lamp and the lens centre re-aim when the focus
;                   readjusts, so the whole rig moves as one body.
shimmer = 0.35
shimmer_px = 1.2
vignette_wander = 0.6
pixel_shift_px = 3
rig_readjust = 0.5
