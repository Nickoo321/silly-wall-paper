; cycle-first.ini -- the FIRST CYCLE (brief reference/briefs/CYCLE-DIRECTOR.md section 5).
; Order = the user's (2026-09-25): interleave the looks, never two WE or two oil stages
; back to back: oil 1, WE 1, oil 2, WE 2, ...  The WE slots all use we-look-live.ini: no
; fluid preset in reference\ carries a distinct hue band (every one is hue_range 180); the
; distinct-band fluid recipes are the user's %APPDATA% moods (the two built-in journey ones
; are kept as reference\presets\WE journey - *.ini, a fluid-only journey stage type).
; order=alternate_random (the default): each next stage is drawn from the stages whose
; look differs from the current one, weighted by stage_N_weight (proven looks 7, moderate
; 2, wild 1), never the same file twice in a row; seed 0 = wall clock. order=fixed walks
; the list as written.
;
; Headless (the proof run): stage files resolve relative to THIS file's folder.
;   FluidWallpaper.exe --shot out.png --ini reference\configs\cycle-first.ini --hdr on
;     --shot-delay 0 --shot-series N:S --cycle-dwell 20 --cycle-seed 1234 --shot-png-only
; Live: copy this [cycle] section into %APPDATA%\FluidWallpaper\settings.ini and make the
; stage_N_file paths absolute (or relative to that folder). [cycle] enabled=0 there is
; today's app, bit for bit.
[cycle]
enabled=1
loop=1
order=alternate_random
seed=0
fade_out=1.5
fade_in=2.5
stage_count=10
stage_1_file=monotone-post-0924.ini
stage_1_dwell=720
stage_1_weight=7
stage_2_file=we-look-live.ini
stage_2_dwell=1200
stage_2_weight=7
stage_3_file=acid-rise-2hue.ini
stage_3_dwell=720
stage_3_weight=2
stage_4_file=we-look-live.ini
stage_4_dwell=1200
stage_4_weight=7
stage_5_file=acid-rise-12.ini
stage_5_dwell=720
stage_5_weight=2
stage_6_file=we-look-live.ini
stage_6_dwell=1200
stage_6_weight=7
stage_7_file=acid-rise-rotate.ini
stage_7_dwell=720
stage_7_weight=1
stage_8_file=we-look-live.ini
stage_8_dwell=1200
stage_8_weight=7
stage_9_file=lapd-look-candidate.ini
stage_9_dwell=720
