; Kept from the retired mood conductor's built-in (moods.cpp, deleted on branch cycle
; 2026-09-25): a PARTIAL overlay (a fluid 'journey' chassis), meant for a cycle
; stage with  stage_N_base=we-look-live.ini  under it. Its [journey] file= names
; journeys\<name>.txt in %APPDATA%\FluidWallpaper\journeys (a fluid-only stage type).
; Journey Duet mood - Storm physics chassis, neutral color, journey-driven hue legs.
; The [journey] section opts into journeys\Duet.txt: blue/purple choreography where
; legs steer the emission band and the field rotation independently
; (journey v2 shift legs: resultant color = emitted hue + field shift).
