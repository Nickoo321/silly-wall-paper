; Liquid Acid — palette A as TRANSPARENT COLOURED OIL (glass).
; Same look as liquid-acid-a-real.ini (the "real oil" edge set), with the oil
; turned from a fill into an ABSORBING FILM over the ink:
;   oil_transparency 0.5  Beer-Lambert T = exp(-oil_absorb * thickness * (1-oilHue))
;                         over the refracted ink, plus oil*(1-T_avg) scatter so a
;                         thick disc still reads orange where the ink is black.
;   oil_film_bump 0.35    slow noise on the thickness: islands of thick and thin.
;   oil_refract_body      the whole film bends what is under it, not just the rim.
;   oil_ink_blur 0.5      the marbling under the film is slightly out of focus.
; Set oil_transparency=0 to get liquid-acid-a-real.ini back exactly.
; Liquid Acid — palette A: vermillion/orange oil on teal-black ink.
; Base = reference/configs/we-look-live.ini (landed WE-parity look, 256 grid).
