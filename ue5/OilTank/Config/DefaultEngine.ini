; OilTank -- headless UE 5.8 scene. Everything is spawned by AOilTankGameMode; no .umap of our own.
; Recipe: reference/briefs/UE5-HEADLESS-LESSONS.md (ManhattanFPV).

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/OilTank.OilTankGameMode

[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; --- crash rule (AMD 0x117/0x141, BSOD 0x7E with HW RT + the wallpaper + a game): never on ---
r.RayTracing=False
r.Lumen.HardwareRayTracing=False
; --- no GI, no ambient, no static lighting: the ONE directional light is the only light ---
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=False
r.Shadow.Virtual.Enable=1
; --- post defaults off; the code-spawned unbound PostProcessVolume sets the rest ---
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=2
r.DefaultFeature.Bloom=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
; AA is chosen at runtime from OilTank.json "aa" (default ssaa2 = no TAA/TSR, 200% screen percentage)
r.AntiAliasingMethod=0
; local fog volumes rendered INTO the volumetric fog so they receive the oil's VSM shadows (5.8 default 1;
; only used by water_mode localfog)
r.LocalFogVolume.RenderIntoVolumetricFog=1

[SystemSettings]
; crash rule repeated here (read at startup either way)
r.RayTracing=0
r.Lumen.HardwareRayTracing=0
r.VSync=0
t.MaxFPS=72
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=4
r.VolumetricFog.GridSizeZ=128
r.VolumetricFog.TemporalReprojection=1
; sharper VSM pages for a 40 cm frame seen from ~7.6 m (each -1 = 2x resolution; VERIFY visually)
r.Shadow.Virtual.ResolutionLodBiasDirectional=-2
r.Shadow.Virtual.SMRT.RayCountDirectional=16
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=8
r.ContactShadows=1
r.LightShaftQuality=1
; no 8-bit dither noise in the A/B (our grain is the reference), no sharpen, no fringe
r.Tonemapper.GrainQuantization=0
r.Tonemapper.Sharpen=0
r.SceneColorFringeQuality=0
r.DepthOfFieldQuality=2
r.MotionBlurQuality=0
r.SSR.Quality=0

; --- DDC on the project's own SSD folder, never C: or the SMR D: (fairness trap 10) ---
; ManhattanFPV's proven block (G:\ManhattanFPV\Config\DefaultEngine.ini): the stock "Installed" graph uses a
; Zen server whose data lives under %LOCALAPPDATA% (C:); replace its Local node with a plain filesystem cache
; inside the project (G:\UE\OilTank\DerivedDataCache).
[DerivedDataCacheGraphs]
Installed=(ProjectPak, InstalledProjectPak, EnginePak=InstalledEnginePak, EnterprisePak, Local=OilTankLocal)

[DerivedDataCacheStores]
OilTankLocal=(Type=FileSystem, UnusedFileAge=34, PromptIfMissing=false, Path="%GAMEDIR%DerivedDataCache")
