; cycle-lerp-test.ini -- proof config for the director's fluid -> fluid LERP (the absorbed
; mood-conductor transition: hue bridge, 4 s smoothstep, discrete flip at t=0.4, hue home
; from t=0.7) and the journey stage type. order=fixed, two fluid stages, then an oil stage
; so the same run also shows a fade after a journey stage.
