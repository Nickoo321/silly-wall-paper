; Ink in water - INVERTED: pale ink on black. The OLED-friendly one, and the default.
; Base = reference/configs/we-look-live.ini (the landed WE-parity look, 256 grid).
; Refs: reference/shots/photos/ink-in-water-ref-*.jpg. Design: reference/INK2D-PLAN.md.
;
; What the single-variable iteration found (frames in build2/shots/ink/):
;  - vorticity 48 (the WE motion) turns a drop into a smoke puff inside 5 s:
;    confinement amplifies grid-scale curls all round the rim and the ink edge
;    term darkens each one. 12 keeps the references' few large lobes with
;    smooth internal sheets; 4 is glassy and mirror-symmetric. -> 12.
;  - velocity_diffusion 0.998 (not 0.999) makes the vortex pair STALL around
;    60-70% frame height instead of coasting into the bottom edge and splitting
;    into two floor lobes.
;  - density_diffusion 0.9997: at 0.999 a drop is pale grey by 13 s; at 1.0 the
;    water never clears at all. 0.9997 holds the cores dark and still empties
;    the frame over ~60 s between drops.
;  - gravity 2 with gravity_blur 3: enough to keep the cap sinking as a unit.
;    Large values (30-100) pile the ink up on the bottom edge within 10 s, and
;    driving the force from the RAW per-texel density (gravity_blur 0) seeds
;    grid-scale Rayleigh-Taylor fringe.
;  - [drops] asymmetry 0.35: a single radially symmetric impulse makes a
;    textbook mirror-symmetric vortex pair. Two unequal off-centre impulses
;    around one dye stamp give the references' unequal lobes for free (the
;    velocity grid is 256; only the dye stamp is expensive).
;  - saturation_restore MUST be 0: CSAdvectDye's restore is (c-min)*..., which
;    is zero for neutral dye, so it erases a grey/white ink outright.
;  - idle_splats 0 also suppresses the startup burst, so the water starts clear.
;  - the whole parity colour chain is neutralised: this look does its own
;    dye->colour mapping and must not be graded on top of it.
;
; KNOWN MISS: a soft bright blob sits at the injection point for ~8 s. It is
; the outer halo of the drop's Gaussian dye stamp, which lies outside the
; velocity impulse and so never acquires momentum (it is NOT the entry tail --
; tail_sec 0.20 vs 0.35 vs 0 makes no difference; drop radius does). It is mist
; on paper and a hot spot in inverted+HDR. Real fix is a compact, finite-support
; drop kernel in CSSplatDye, deliberately not done here because that shader is
; shared with style=fluid.
