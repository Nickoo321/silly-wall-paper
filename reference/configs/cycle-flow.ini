; cycle-flow.ini -- the LONG-RUN cycle (user 2026-10-04: "turn towards hues changing more
; continuously between black screen transitions. Make the time between black screens longer,
; like 3-4x longer, and make WE show up 50% less"). The stage list, tiers and weights are
; cycle-final.ini's, unchanged; only the pacing differs:
;   we_every=2            WE comes after every SECOND non-WE look (was: after every one), so WE
;                         is visited half as often relative to the oil / ink looks. Two Scheme
;                         stages back to back change with NO black (the scheme swap).
;   dwell                 oil 180 -> 600 s, WE 240 -> 480 s, ink 150 -> 450 s, Mirror overlay
;                         120 -> 240 s, +-30% jitter (the maximum is 900 s now, was 240).
;   scheme_hue_period=900   every Scheme's hue rotation turns once in 15 min (its base says
;                         3600): during a 10 min stage the film travels about two thirds of
;                         the wheel, lingering at the proven anchors (hue_anchor_weight 1),
;                         instead of sitting within ~10 deg of where it faded in. (1200 first;
;                         900 after the user's "perhaps add more hueshifting", same day.)
; Expected pacing (draw shares of cycle-final): a black screen about every 12 min on average
; (was every 3.5 min), WE about 29% of the time (was 57%).
; Stage files resolve relative to THIS file's folder, exactly like cycle-final.ini.
; Stage 2 is monotone-stage.ini (an empty partial on monotone-post-0924.ini: the same look), so that
; a [cycle] oil_layout reaches the monotone stage too (the layout loads between base and file).
; Live: tools\cycle-install.ps1 -CycleIni reference\configs\cycle-flow.ini
[cycle]
enabled=1
loop=1
order=alternate_random
seed=0
dwell=600
jitter=0.3
fade_out=1.5
fade_in=2.5
burst_weight=0
we_every=2
scheme_hue_period=900
stage_count=21
stage_1_file=we-look-live.ini
stage_1_tier=proven
stage_1_dwell=480
