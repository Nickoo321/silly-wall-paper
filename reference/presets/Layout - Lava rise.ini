; Layout - Lava rise.ini -- brief BZ BLACK-MASS phase 1
; Lava rise (target ~25 %, tall blobs rising, small bubbles pinch off the tops): the base already has
; acid-rise-12's rise block; 56 blobs (vs 126) break the lit film into rising lobes that pinch off lit
; blobs into the black, rise_stretch .8 (vs .45) makes them teardrops along the climb. No turnover key:
; blob_count walks under conserve_mass (the surplus dissolves over dissolve_s), the rest is per-frame.
; Layout presets (brief BZ BLACK-MASS phase 1): PARTIAL overlays on reference\configs\monotone-post-0924.ini
; ("Today" = that base itself, no file). ROLE A: on the monotone base the FILM is lit and the black masses
; are the GAPS between the oil blobs (+ kind-3 holes); fewer/smaller positive blobs = more black.
; Every layout sets the same key set (base values where it does not move a key) so the three can be
; applied in any order; blob_turnover_s is set only where the layout needs its kind keys to reach a
; standing population (Lava rise inherits it). Oil and droplets stay black (dye_lum 0 / dye_droplet_lum -1
; are the base's), film_level untouched, bloom = the base's.
; black % = share of max(R,G,B) < 40 on the 8-bit SDR png (tools\black-share.ps1), 1280x720,
; 300 s window (31 frames, 10 s apart), seeds 1234/5678/9012, HDR on; HDR off seed 1234.
; MEASURED: (filled in after the 3-seed run)
[meta]
look = liquid_acid
[liquid_acid]
blob_count = 56
bubble_frac = 0.49
hole_min = 0.03
hole_max = 0.13
