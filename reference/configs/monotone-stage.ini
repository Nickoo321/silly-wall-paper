; monotone-stage.ini -- the monotone look AS A CYCLE STAGE: a partial with no keys of its own
; on reference/configs/monotone-post-0924.ini ([meta] base). It composes to exactly that look.
; Why it exists (2026-10-04): [cycle] oil_layout is loaded between a stage's base and its file,
; so the stage FILE always wins and a Settings Save into it takes effect. A stage whose file is
; the full monotone-post-0924.ini would override every layout key; this stage lets the monotone
; look follow the cycle's layout like the Scheme stages do. Keys saved here from the Settings
; window apply to the monotone cycle stage only.
[meta]
look = liquid_acid
base = monotone-post-0924.ini
