; Scheme - Square Plus.ini -- brief BV colour scheme: an OFFSET PATTERN, a partial overlay
; on reference\configs\monotone-post-0924.ini. It never sets a film hue: the pattern
; rides the hue rotation (hue_rotate_period) and hue_anchor_weight 1 makes the
; rotation linger at the proven anchors (magenta 325 most, blue 215, red 355,
; violet 275). The named look is what the pattern shows at its ANCHOR hint.
; Pattern: hue2 +180, hue3 +90, shadow tint 235 (BU).
; Named schemes on this pattern (tier, anchor = film hue of the named look):
;   Square+          Q1 4-COLOUR  anchor 325 -- mint + gold, blue darks; the gold third stays BRIGHT
; The 4th colour is the BU split tone on the dark tones at a FIXED hue
; (shadow_tone_hue), always on (shadow_tone_period 0), rule 7: cool/violet only.
; Rules (brief BV): oil + droplets black (dye_lum 0, dye_droplet_lum -1); FILMS
; equal-loaded (film_equal_load, dims only); PATCHES are never dimmed, so a
; yellow/gold/lime member stays bright; third colour <= ~15% of the frame
; (film_hue3_share: 0.75 ~ 13% at cover 0; with cover 0.04 it is 1, see below).
; FINAL-CYCLE C: film_hue2_cover 0.04 lifts the second colour a little (a warm or third colour stays small).
; film_hue3_share 1 keeps the third at today's ~6% mean (<= ~15%) under that bias.
; palette_start_hue 325 (brief BW): the palette clock starts where the film is 325 (the
; anchor of the named look) at app start and at each cycle entry, not on oil_color_1 orange.
[meta]
look = liquid_acid
[liquid_acid]
hue_sweep_period = 0
hue_anchor_weight = 1
palette_start_hue = 325
dye_lum = 0
dye_droplet_lum = -1
film_equal_load = 0.75
film_hue2 = 180
film_hue2_amt = 1
film_hue2_scale = 0.40
film_hue2_cover = 0.04
film_hue3 = 90
film_hue3_amt = 1
film_hue3_share = 1
shadow_tone = 1
shadow_tone_hue = 235
shadow_tone_period = 0
