; --- DROPLET PARTICLE SIM -------------------------------------------------
; Real particles, not the screen-space cellular swarms: they are added into
; the SAME metaball field as the big blobs, so a trapped water droplet is a
; literal hole in the oil and an oil droplet on the ink a literal bump of it.
; They ride the oil they sit in, nucleate where the film is thin, attract,
; coalesce (area-conserving) and dissolve. swarm_holes/swarm_drops are set to
; 0 here explicitly -- the code forces them off anyway, but ONE system is the
; point and the ini should say so.
droplets = 1500
droplet_spawn_rate = 40
swarm_drops = 0
swarm_density = 0.2674
swarm_scale_holes = 22
swarm_scale_drops = 30
swarm_r_min = 0.120
swarm_r_max = 0.420
swarm_rim_dark = 0.55
ink_levels = 4
ink_soft = 0.60
ink_mix = 0.95
ink_hue_vary = 3
ink_gain = 1.30
ink_bias = 0.03
seam_strength = 0.30
seam_lo = 0.06
seam_hi = 0.70
grain = 0.057
grain_scale = 3.0
speckle = 0.2227
oil_color_1 = 0.95 0.40 0.10
oil_color_2 = 0.98 0.45 0.08
oil_color_3 = 0.92 0.35 0.12
oil_color_4 = 1.00 0.50 0.05
ink_stop_1 = 0.086 0.478 0.494
ink_stop_2 = 0.016 0.040 0.046
ink_stop_3 = 0.478 0.165 0.020
ink_stop_4 = 0.980 0.545 0.078
ink_mode = water
ink_complement_lock = 0
; --- "real oil" edge set (54780a0): no stroked boundary, the film thins
; --- to nothing at its edge and the halo is emergent from the ink. ---
; Edge treatment. 1 = CRISP: a big hole ends on the same hard isoline the
; droplets do, with only its thin meniscus, instead of fading out over a wide
; translucent band that scales with its size. 0 = the soft film edge, shipped
; as "Liquid Acid - rising colours (soft film edge).ini". User 2026-09-17,
; shown stills of both: "hard to say in stills, apply all".
oil_edge_mode = 0
; --- hollow "lens" droplets, and the rafts they pack into (2026-09-17) ------
; The user, on two panel photos of the live rising look: "I like these empty
; doubles, you think you can add more of them", and, with photos of boiling oil
; and a soap raft: "it kinda looks like this, should probably clump". So a
; third of the trapped droplets are drawn as a thin dark RING with the oil
; showing through the middle, and rings attract each other and pack into rafts
; with a shared wall instead of merging. A solid droplet still absorbs a ring.
droplet_ring_frac = 0.15
droplet_ring_width = 0.13
droplet_ring_lift = 0.08
droplet_ring_clump = 0.6
droplet_ring_wobble = 1
; --- edge profile ----------------------------------------------------------
; "smudge the border more -- it looks like it goes from green to black, then
; stops; it should be more S-curved". Same band, smootherstep profile, so the
; slide from oil colour to black has no knee at either end.
oil_edge_curve = 1
; --- backlight penumbra ----------------------------------------------------
; The lamp is under the middle of the dish, so the oil right beside a black
; mass is lit less than the open sheet -- and a pigment lit less shifts hue as
; well as level. Very subtle on purpose: depth, not a coloured outline.
oil_penumbra = 0.3
oil_penumbra_px = 8
oil_penumbra_hue = 12
oil_penumbra_dark = 0.15

; --- macro "cellulose" surface texture (2026-09-18, brief O) ---------------
; The user, on the Requiem microscope frame: the cell body is fibrous and
; mottled, and they want that "in the black oil more than the oil". An
; anisotropic fBm stretched along a slowly turning direction (strands, not
; blobs), drifting with the rise, added in the display pass under the grain.
; On the black it is a THICKNESS effect: strongest just inside the edge of a
; black mass, gone deep inside it, so true black stays true black.
cellulose = 0.45
cellulose_ink = 1
cellulose_oil = 0.35
cellulose_scale = 40
cellulose_drift = 1
oil_thin_edge = 0.70
oil_edge_frac = 0.14
oil_specular = 0.35
oil_iridescence = 0.20
swarm_lens = 0.80
meniscus_from_ink = 1.0
oil_glow = 0.45
refraction_width = 22

; --- transparent coloured film (08a89aa) at the user's pick: 0.5 with the
; --- chroma held back to the opaque level (measured x1.19 on tile9-08). ---
oil_transparency = 0.5
oil_absorb = 2.6
oil_film_bump = 0.35
oil_refract_body = 0.006
oil_ink_blur = 0.5
; USER PICK (2026-09-17): oil_transparency 0.5 with the chroma HELD to the
; opaque level -- "the 50% chroma held is the best". post_chroma scales the
; finished frame's colourfulness about its own luma; measured on tile9-08 at
; t=75, OKLab means over the non-dark pixels: opaque L .663 C .194, film 0.5
; alone L .575 C .169, film 0.5 + post_chroma 1.2 / post_lift 1.08 L .63 C .20.
post_chroma = 1.2
post_lift = 1.08

