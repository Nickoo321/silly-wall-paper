; The CAMERA, and it is a MICROSCOPE, not a film stock: oil under a macro lens.
; The user's own summary of the reference photos is "super super slightly
; doubling plus noise", so everything optical here errs subtle and every knob
; is left for them to push.
;   softness  nothing in a macro shot is razor-sharp -- "these edges are way
;             too accurate and focused". Defocuses the isolines themselves
;             (coverage band, film edge, rim, meniscus); the grain stays sharp.
;   halo      the bright-field double contour: a weak, WIDE glow hugging the
;             outside of every dark shape with a faint darker echo beyond it.
;   aberration a warm/cool fringe along each edge, under a pixel wide: present,
;             minor, and only visible if you look for it.
;   film_grain real film grain, luminance-weighted, clearly there.
;   vignette  a gentle field-stop fall-off, never a circle.
film_grain = 0.11
film_grain_size = 1.5
film_grain_speed = 1
film_grain_color = 0
softness = 1.5
halo = 0.12
halo_px = 12
aberration = 0.35
aberration_px = 0.8
aberration_field = 0.6
vignette = 0.12
band_min = 1

; --- FILM OVERLAY (2026-09-18, brief P) ------------------------------------
; The artefacts of a projected film, procedural and image-space: hairs caught
; in the gate, dust, fine scratches, the odd coloured light leak. Additive and
; weighted into the DARK pixels ("the black oil more than the oil"), authored
; at 1440p and scaled with the frame, and the population CHANGES -- the dust
; flickers every film frame, a hair sticks for a few seconds, a scratch
; persists for a stretch and drifts away. "A very very subtle thing" (the
; user), so these are starting points: every one of them is a Settings slider.
film_dust = 0.10
film_hairs = 0.12
film_scratches = 0.10
film_leak = 0.06
film_artefact_rate = 5
; a second, finer and faster noise layer under the coarse grain
film_noise = 0.04
film_noise_size = 1
; the stock's own grade, last of all: lifted teal shadows, warm highlights
film_stock = 0.15

; --- LIGHT IN THE WATER (2026-09-18, brief Q) ------------------------------
; The reference is a glass of cloudy water with a lamp under it: the water
; itself glows, brightest near the lamp and fading with distance, and the
; bright film bleeds a very wide, very weak wash into the black. One off-view
; light position drives both, and it never sits still -- a sum of slow sines
; over seconds to a minute, the frame's own idle animation. The haze falls to
; EXACTLY zero away from the lamp, so the OLED's black is still black.
fog = 0.65
fog_px = 900
bloom = 0.55
bloom_px = 180
light_x = 0.5
light_y = 1.2
light_drift = 1
