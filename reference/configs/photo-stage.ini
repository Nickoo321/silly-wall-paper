; photo-stage.ini -- brief BY PHOTO-STAGE: THE photo stage file. As a [cycle] stage
; (stage_K_file=photo-stage.ini; its [photo] section makes it a photo stage, persisted as
; stage_K_photo=1) it shows ONE still from the folder for its dwell, entered and left
; through black like a look change. Not a preset: no [meta] look= (the tray and the
; library would file it as an overlay), and --ini on it renders the default fluid look.
;   folder=  empty = the default photos folder next to presets\ (tray: "Open photos
;            folder"; under --shot: --photos <dir>, else none -> the stage is skipped).
;            Absolute, or relative to this file. *.jpg *.jpeg *.png *.bmp *.tif *.tiff
;            (+ .webp .heic .avif when WIC has a decoder); sub-folders are not scanned.
;   fit=     fit (letterbox / pillarbox, pure black) | fill (cover, centred crop)
; An empty folder skips the stage (no black, no pause); photos added later appear at
; the next visit (re-scanned every draw).
[photo]
folder=
fit=fit
