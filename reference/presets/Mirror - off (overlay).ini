; Mirror overlay -- an OVERLAY preset: it carries NOTHING but [mirror], so
; applying it from the tray folds whatever look is already running and leaves
; every other key alone (presets are merged over the live config; see
; ApplyPreset in src/main.cpp). Apply "Mirror - off" to unfold again.
;
; mode     0 off | 1 horizontal | 2 vertical | 3 quad | 4 kaleidoscope
; segments kaleidoscope wedges (mode 4)
; source   which quarter of the sim you SEE and that gets copied around:
;          +1 = right half, +2 = bottom half
; center_x/center_y  the fold point (0.5 0.5 = the middle of the screen)
; rotate_period  s per turn of the kaleidoscope's axes (0 = fixed)
; drift    0..1 slow wander of the fold point, so the seam is not glued down
; soft     uv units: rounds the fold crease off (0 = a hard mirror)

[mirror]
mode=0
