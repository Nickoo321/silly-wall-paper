; cycle-photo-test.ini -- brief BY PHOTO-STAGE proof cycle (pre-flight 32). order=fixed,
; jitter 0: stage 1 = we-look-live for 5 s (a one-stage photo list could never boot or
; revisit), then one photo stage per test case (reference\photos-stage\<case>\) for 10 s.
; Timeline (2560x1440, fixed 1/144 s steps): WE boot warm-up 2 s + fade in 2.5 s +
; dwell 5 s; then per photo stage: fade out 1.5 s, black point (decode joined under
; --shot), fade in 2.5 s, dwell 10 s -> photo dwell mid-points at ~18.5 + 14.01 k s.
; Proof shots: --shot-delay 19 --shot-series 7:14 (HDR on and off).
[cycle]
enabled=1
order=fixed
seed=1234
jitter=0
stage_count=8
stage_1_file=we-look-live.ini
stage_1_dwell=5
stage_2_file=photo-test/bars-16x9.ini
stage_2_dwell=10
stage_3_file=photo-test/bars-4x3.ini
stage_3_dwell=10
stage_4_file=photo-test/bars-21x9.ini
stage_4_dwell=10
stage_5_file=photo-test/grey16.ini
stage_5_dwell=10
stage_6_file=photo-test/grey8.ini
stage_6_dwell=10
stage_7_file=photo-test/offsize.ini
stage_7_dwell=10
stage_8_file=photo-test/fill-4x3.ini
stage_8_dwell=10
