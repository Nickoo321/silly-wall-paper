; Liquid Acid — ink-in-water under TRANSPARENT COLOURED OIL (glass).
; liquid-acid-water.ini plus the "real oil" edge set and the transparent-film
; keys. This is the case the film was built for: the water is mostly clear, so
; the pale ink plumes run straight THROUGH the orange discs, tinted by them,
; while the oil over empty black water keeps its own colour from the scatter
; term. Set oil_transparency=0 for the shipped opaque look.
; Liquid Acid + INK IN WATER: the oil layer floating on real ink-in-water
; instead of the posterised duotone bands. This is what the acid references
; literally are. Base = reference/configs/liquid-acid-a.ini, unchanged except
; for the ink path and the sim settings the ink needs.
;
; OIL POPULATION (retuned 2026-09-17 for THIS flow): liquid-acid-a.ini's
; population was tuned against the busy WE-parity sim (vorticity 48, wanderers
; + idle splats), which constantly shoves the blobs apart. The ink sim here is
; deliberately calm (vorticity 12, no wanderers, no idle splats, one drop every
; ~11 s), so the same blobs settle, spread on `repulsion` alone and merge into a
; ~90% oil sheet with confetti holes. The [liquid_acid] population keys below
; are therefore this ini's OWN: fewer, fatter blobs (64 instead of 96), a higher
; isoline (threshold 0.65) and a tighter support (1.60), for ~50% coverage --
; big discs with ink channels between them, like a12. Everything else in
; [liquid_acid] is still liquid-acid-a.ini's palette A.
;
; [liquid_acid] ink_mode=water routes the ink through the SAME shared HLSL
; block as [look] style=ink (InkWater in src/shaders.h): Beer-Lambert
; translucency, edge darkening, inverted tinting. The oil rims, meniscus,
; swarms, speckle and grain are untouched and composite over it.
; The water ink reads the RAW dye, so like bands mode at ink_mix~=1 it bypasses
; the parity CSS chain, and the ink complement lock does not apply (water ink
; has no ramp) - hence ink_complement_lock=0 here.
; Base = reference/configs/we-look-live.ini (landed WE-parity look, 256 grid).

; --- THE LAMP CASTS SHADOWS (brief BC) ------------------------------------
; The user: "the light should cast shadows essentially... it can be from
; behind, or the bottom, or the top or side." Until now the lamp lit the
; frame and nothing in it blocked any of that light. Now every mass and every
; droplet darkens the film on the side AWAY from the lamp -- which, with
; light_y 1.2, is UP -- tightest and darkest against the caster and softening
; as it runs out. A droplet's shadow is as short as the droplet is tall.
;   shadow_amt   0.40: a real shadow, not a heavy one ("I really don't see
;                the shadows that well", so well above invisible, well under
;                the point where the film above a mass goes muddy)
;   shadow_len   the longest reach, as a fraction of the screen height
;   shadow_soft  how fast the penumbra opens up along the shadow
; The lamp's own height is [post] light_z, down in the camera block.
shadow_amt = 0
shadow_len = 0.12
shadow_soft = 0.50

; --- MULTICOLOUR OIL (brief AE, ref oil-colour-combo-ref-1.jpg) -----------
; A second dye hue living IN the thin film: soft patches that the sim's own
; velocity advects, so they stretch and fold with the flow instead of sliding
; over it. The reference the user kept is a magenta film carrying cyan patches
; that read like a light leak -- but a leak is additive and would lift the
; black corners, and there the cyan sits UNDER the masses, which only a dye
; can do. The masses stay black over it; the droplets inside them take the
; same hue (crust_hue_mix), which is the ref's cyan-lit specks in the black.
; This palette sweeps through eight hues, so film_hue2 is a ROTATION off
; whatever the film currently is: -140 deg turns the hot pink toward cyan and
; keeps the same relationship at every step of the sweep. The amount is how
; far AROUND the wheel a patch goes, not a cross-fade to the far colour --
; blending magenta with cyan in RGB is grey -- so 1.0 is what lands the
; patch cores on the reference's cyan. Half of it would be blue.
film_hue2 = 0
film_hue2_amt = 0
film_hue2_scale = 0.35
film_hue2_drift = 1.0
film_hue2_decay = 0.35
film_hue2_wobble = 0
film_hue2_wobble_period = 300
film_hue2_seed_rows = 2
film_hue2_rise = 0.25
film_hue3 = 0
film_hue3_amt = 0
crust_hue_mix = 1.0
; --- SEAM REFLECTION REACH (2026-09-22, brief AJ) --------------------------
; The user, watching the hue2 seam live: "whatever algo is mixing the oil
; boundary is insanely good", "and the way the bubbles reflect it,
; accurately", "chef's kiss" -- then "turn up the radius of effect maybe, so
; further particles also reflect it on the boundary", and on the marked-up
; photo, two red lines: the seam's colour should reach the droplets up to
; about a THIRD of the screen height above it, fading with distance.
; Before this key a droplet's lit rim, lens highlight and glow were all
; tinted with the film colour at the droplet's own pixel, so a droplet only
; carried the seam's magenta while it stood inside the field's 0.56..0.68
; transition band -- about one droplet across at patch size 0.35. That band
; width was the whole reach, and 0 keeps it.
; 0.33 = the user's far line. The rims (never the film) rotate toward the
; seam's own hue -- the band's midpoint, which off this blue is the magenta
; in the photo -- with a smooth falloff, so the near droplets keep exactly
; the colour that earned the "chef's kiss" and the far ones pick it up
; faintly. Nothing is blurred: the rims stay as sharp as they were.
boundary_reflect_r = 0
boundary_reflect_amt = 1.0

; --- DYE THE BLACK (2026-09-22, brief AG / AM) ------------------------------
; The user: "add ability to dye the black ink", and note 11, "make the
; currently black oil mostly purple". The references are lava lamps -- amber
; wax over orange -- where the dark body is not black at all but a DEEP
; translucent colour with the lamp showing through.
; READING NOW (2026-09-22, branch dye4). The two earlier attempts dyed the ink
; RAMP and rendered byte-identical, because this preset runs ink_mode = water
; and in water mode the mass colour comes from InkWater()'s paper_color -- the
; ramp is never read (full trace at "DYE THE DARK MASSES" in src\shaders.h).
; The dye is now applied in the display pass on the ink layer itself, as a
; translucent wax: dye_lum is the light the THIN edge passes and the thick core
; keeps about 40% of it, so a big mass is darkest where it is deepest and glows
; at its rim, exactly like the lavalamp-ref-4/5 wax. The film is untouched, and
; the crust droplets and mass_rim still read against the body.
; VALUES (sheet build2\shots\live\dye4-sheet.png, hue 250/285/320 x lum
; 0.16/0.28/0.44, seed 1234, t=60 s):
;   hue 250 goes blue-violet and reads cold next to the magenta film;
;   hue 320 lands on the film's own magenta and the mass turns muddy;
;   hue 285 is the purple-violet of note 11 and holds apart from the film.
;   lum 0.16 is still basically black, 0.44 lifts the mass until it stops
;   reading as the dark body. 0.30 is the deep wax with the core still dark.
; dye_hue_follow is left at 0 on purpose: with 1 the wax tracks the film hue
; and would turn orange when the 8-pair sweep reaches its green family, and
; note 11 asked for purple. The cost is that when the sweep reaches its own
; violet pair (sweep_oil_3) the wax and the film sit close together -- worth
; its own A/B before changing this.
dye_hue = 0
dye_sat = 0
dye_lum = 0
dye_hue_follow = 0

