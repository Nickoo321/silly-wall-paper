; oil3d-default.ini -- the Oil3DWallpaper prototype's own defaults (brief
; reference/briefs/NEXT-oil3d.md). ALONE it renders the live cycle's HOME stage in
; 3D: monotone-post-0924.ini (the [meta] base, applied first) + the cycle's
; oil_layout "Layout - Few giants" (its [liquid_acid] keys are copied below,
; because one file can carry only one base) + the [oil3d] block.
;
;   Oil3DWallpaper.exe --shot x.png --ini reference/configs/oil3d-default.ini
;
; Any other stage is the 2D stack itself, no copy of this file needed (every
; [oil3d] value below is also the compiled-in default):
;   --ini reference/configs/monotone-post-0924.ini
;   --ini "reference/presets/Layout - Few giants.ini"
;   --ini "reference/presets/Scheme - Magenta Cyan.ini"
; (base, layout, stage -- the 2D cycle's order; a stage's own [meta] base is
; skipped when an earlier --ini already applied it, e.g. acid-rise-12-tone-half.)
;
; The live cycle overrides the hue rotation of the Scheme stages with
; [cycle] scheme_hue_period=900; [oil3d] hue_rotate_period=900 reproduces that.
[meta]
look = liquid_acid
base = monotone-post-0924.ini

[liquid_acid]
; "Layout - Few giants.ini" (the user's pick: fewer, bigger blobs, big black holes)
blob_count = 50
bubble_frac = 0.37
hole_min = 0.15
hole_max = 0.3
hole_weight = 2.5
threshold = 0.79
rise_stretch = 0.45
droplets = 500
blob_turnover_s = 90

[oil3d]
; ---- march ---------------------------------------------------------------
; steps: march iterations inside the ray's support interval (the loop may take
;   up to 2x when the safe steps are short; measured mean ~20 on this stage)
; refine: bisection steps at the crossing
; half_res: raymarch at half resolution and upsample (the timing fallback)
; blobs: -1 = [liquid_acid] blob_count (the prototype caps at 64)
steps = 64
refine = 5
half_res = 0
blobs = -1
; ---- slab + camera -------------------------------------------------------
; depth: slab depth in screen heights; fov: vertical degrees; the front plane
;   fills the frame exactly. camera_drift: orbit amplitude (screen heights) of
;   the very slow parallax drift, camera_drift_period its period in seconds.
depth = 0.60
fov = 38
camera_drift = 0.025
camera_drift_period = 97
; radius_scale: 3D radius = 2D radius x this
; hole_depth_stretch: holes are ellipsoids this long along z, so a big hole
;   reads as a tunnel the black backdrop shows through
; cavity_dark: how far a hole-carved wall goes to the black role (or the
;   masses' dye when dye_lum > 0)
radius_scale = 1.0
hole_depth_stretch = 1.8
cavity_dark = 0.90
; ---- motion (on top of the 2D rise keys) ---------------------------------
; flow_amp: the analytic curl flow that stands in for the 2D fluid (uv/s)
; z_drift: the slow depth wander that makes blobs cross in front of each other
; parallax3d: share of the 2D size-based rise_parallax kept (depth already
;   slows the far blobs on screen through the perspective)
flow_amp = 0.004
z_drift = 0.006
parallax3d = 0.5
; ---- shading -------------------------------------------------------------
; shade = gloss (wax / oil) | flat (the 2D identity: flat fill, bands, dark rim)
shade = gloss
; lights: direction TOWARD the light (+y is DOWN, +z away from the camera)
; light0 = the lamp under the column, light1 = the 2D rig's top-left lamp
light0_dir = 0.20 0.85 -0.50
light0 = 0.45
light1_dir = -0.60 -0.60 -0.55
light1 = 0.42
wrap = 0.15
ambient = 0.06
; spec: the SMALL hot lobe (the only thing the HDR lift touches)
spec = 0.55
spec_power = 240
; rim: fresnel rim in the accent (seam) colour, x (0.65 + mass_rim)
rim = 0.90
rim_power = 3.5
; sss: thickness glow ("lit from inside"); sss_sigma per screen height of wax
sss = 0.30
sss_sigma = 12
ao = 0.55
fog = 0.35
exposure = 1.0
; edge_soft: silhouette AA band, in n.v
edge_soft = 0.10
; flat mode only
flat_bands = 3
flat_soft = 0.25
flat_rim_width = 0.22
flat_rim_dark = 0.85
; ---- far wall (the ink) --------------------------------------------------
; ink_marble: -1 = auto (0 in ink_mode=water when the 2D water never gets ink,
;   i.e. [behavior] idle_splats=0 and [drops] drops=0 -- every live stage --
;   so the wall is the black paper)
ink_marble = -1
ink_marble_scale = 2.2
ink_flow = 0.010
; ---- droplets ------------------------------------------------------------
; the 2D runs hundreds of droplet particles summed into the field; the 3D
; prototype carries min(droplets / 12, droplet_cap) analytic beads
droplet_cap = 40
droplet_scale = 1.6
; ---- scheme patches ------------------------------------------------------
; mix_contrast: contrast of the hue2/hue3 patch field (1.2 = ~19% second hue,
;   ~13% third hue of the wax at film_hue2_cover 0.04, like the 2D)
mix_contrast = 1.2
; hue_rotate_period: > 0 replaces [liquid_acid] hue_rotate_period (-1 = keep)
hue_rotate_period = -1
; debug: 0 off; 1 normal, 2 hole share, 3 AO, 4 thickness, 5 unlit fill,
;   6 march iterations, 7 ray list size
debug = 0
