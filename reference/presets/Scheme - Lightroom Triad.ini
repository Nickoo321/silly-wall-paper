; Scheme - Lightroom Triad.ini -- brief BV colour scheme: an OFFSET PATTERN, a partial overlay
; on reference\configs\monotone-post-0924.ini. It never sets a film hue: the pattern
; rides the hue rotation (hue_rotate_period) and hue_anchor_weight 1 makes the
; rotation linger at the proven anchors (magenta 325 most, blue 215, red 355,
; violet 275). The named look is what the pattern shows at its ANCHOR hint.
; Pattern: mono (film only), shadow tint 180 (BU).
; Named schemes on this pattern (tier, anchor = film hue of the named look):
;   Lightroom Triad  T3b 3-COLOUR anchor 325 -- magenta film + teal shadows + gold highlights: a split-tone GRADE, not three patch colours
; NOTE: needs BU-b highlights/balance (highlight_tone_*, tone_balance): this is a
; Lightroom-style split-tone GRADE, not patch colours. BU (shadow_tone*, merged)
; gives the teal shadows now; the gold highlights + balance arrive with BU-b.
; Rules (brief BV): oil + droplets black (dye_lum 0, dye_droplet_lum -1); FILMS
; equal-loaded (film_equal_load, dims only); PATCHES are never dimmed, so a
; yellow/gold/lime member stays bright; third colour <= ~15% of the frame
; (film_hue3_share: 0.75 ~ 13% at cover 0; with cover 0.04 it is 1, see below).
[meta]
look = liquid_acid
[liquid_acid]
hue_sweep_period = 0
hue_anchor_weight = 1
dye_lum = 0
dye_droplet_lum = -1
film_equal_load = 0.75
film_hue2_amt = 0
film_hue3_amt = 0
shadow_tone = 0.6
shadow_tone_hue = 180
shadow_tone_period = 0
shadow_tone_lift = 0.03
